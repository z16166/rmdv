name: Release

# Builds and publishes six 64-bit archives for a `v*` tag:
#   Windows (x86_64, arm64) — MSVC CRT linked statically (+crt-static)
#   macOS 11.0+ (x86_64, arm64) — MACOSX_DEPLOYMENT_TARGET=11.0
#   Linux glibc 2.28+ (x86_64, arm64) — built inside AlmaLinux 8
#
# Each archive holds the binary, its PDFium shared library (where PDF support
# is built in), README.md, and LICENSE. The publish job also uploads
# SHA256SUMS.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v0.11.0). Leave empty to build artifacts only.'
        required: false
        type: string
      dry_run:
        description: 'Build and verify every artifact, but do not publish a release'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  MACOSX_DEPLOYMENT_TARGET: '11.0'
  # Artifact prefix and release tag. A manual run without a tag builds under
  # `build-<sha>` and never publishes.
  RELEASE_TAG: "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' && github.event.inputs.tag || (github.event_name == 'workflow_dispatch' && format('build-{0}', github.sha)) || github.ref_name }}"
  # A manual run for an existing tag must build that tag, not the branch the
  # run was started from.
  CHECKOUT_REF: "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' && github.event.inputs.tag || github.ref }}"

jobs:
  # ── Tests gate every build job, so nothing publishes from a failing commit.
  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml

  # ── Windows: MSVC runtime is linked statically, so the zip needs no VC++
  #    redistributable on Windows 10/11. Best-effort PDF support is off here,
  #    matching `cargo check --no-default-features` in CI.
  build-windows:
    name: Windows ${{ matrix.arch }}
    needs: tests
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release
        run: cargo build --release --no-default-features --target ${{ matrix.target }}

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch == 'arm64' && 'arm64' || 'amd64' }}

      - name: Verify static MSVC runtime
        shell: pwsh
        run: |
          $exe = "target/${{ matrix.target }}/release/rmdv.exe"
          if (!(Test-Path $exe)) { throw "missing $exe" }
          $imports = & dumpbin /nologo /dependents $exe
          $imports
          $dynamic = $imports | Select-String -Pattern 'VCRUNTIME|MSVCP|MSVCR|api-ms-win-crt'
          if ($dynamic) { throw "dynamic MSVC runtime import: $dynamic" }
          Write-Host "OK: MSVC runtime is statically linked"

      - name: Package zip
        shell: pwsh
        run: |
          $stage = "dist/rmdv-$env:RELEASE_TAG-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/rmdv.exe" $stage
          Copy-Item README.md, LICENSE $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "$stage.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  # ── macOS: both slices are built on the arm64 runner (the Intel slice is a
  #    cross build). PDF support is on; libpdfium.dylib is shipped next to the
  #    binary because it is dlopen'd at runtime. Ad-hoc signing keeps arm64
  #    binaries launchable without a Developer ID certificate.
  build-macos:
    name: macOS ${{ matrix.arch }}
    needs: tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            target: aarch64-apple-darwin
            pdfium_asset: pdfium-mac-arm64
          - os: macos-15
            arch: x86_64
            target: x86_64-apple-darwin
            pdfium_asset: pdfium-mac-x64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package tar.gz
        shell: bash
        run: |
          set -euo pipefail
          OUT="target/${{ matrix.target }}/release"
          NAME="rmdv-${RELEASE_TAG}-${{ matrix.target }}"
          STAGE="dist/$NAME"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp "$OUT/rmdv" "$STAGE/rmdv"

          # PDFium is dlopen'd from next to the binary. A warm rust-cache can
          # skip the liteparse build script that normally copies it into
          # target/, so fetch the same pinned asset as a fallback.
          DYLIB=$(find "$OUT" target -name libpdfium.dylib -type f -print -quit 2>/dev/null || true)
          if [ -z "$DYLIB" ]; then
            SYS=$(ls -d "$HOME"/.cargo/registry/src/*/liteparse-pdfium-sys-* | sort -V | tail -1)
            PDFIUM_TAG=$(sed -n 's/^const PDFIUM_RELEASE_TAG: &str = "\(.*\)";$/\1/p' "$SYS/build.rs")
            if [ -z "$PDFIUM_TAG" ]; then
              echo "::error::cannot resolve the pinned PDFium release"
              exit 1
            fi
            TMP="$RUNNER_TEMP/pdfium"
            rm -rf "$TMP"
            mkdir -p "$TMP"
            curl -fsSL "https://github.com/run-llama/pdfium-binaries/releases/download/${PDFIUM_TAG//\//%2F}/${{ matrix.pdfium_asset }}.tgz" \
              | tar -xz -C "$TMP"
            DYLIB="$TMP/lib/libpdfium.dylib"
          fi
          if [ ! -s "$DYLIB" ]; then
            echo "::error::libpdfium.dylib not found"
            exit 1
          fi
          cp "$DYLIB" "$STAGE/libpdfium.dylib"

          cp README.md LICENSE "$STAGE/"

          # arm64 macOS refuses to execute unsigned code; ad-hoc signatures are
          # enough for a locally extracted build.
          codesign --force --sign - "$STAGE/libpdfium.dylib"
          codesign --force --sign - "$STAGE/rmdv"

          MINOS=$(otool -l "$STAGE/rmdv" | awk '/minos /{print $2; exit}')
          echo "macOS deployment target: ${MINOS:-unknown}"
          if [ -z "$MINOS" ]; then
            echo "::error::cannot read the binary's LC_BUILD_VERSION minos"
            exit 1
          fi
          if [ "$(printf '%s\n11.0\n' "$MINOS" | sort -V | head -1)" != "11.0" ]; then
            echo "::error::binary targets macOS $MINOS, expected 11.0 or newer"
            exit 1
          fi

          tar -czf "dist/$NAME.tar.gz" -C dist "$NAME"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # ── Linux: built inside AlmaLinux 8 (glibc 2.28) rather than on the Ubuntu
  #    runner, whose newer glibc would silently raise the binary's floor. The
  #    arm64 job runs natively on the arm64 runner and pulls the arm64 image.
  build-linux:
    name: Linux ${{ matrix.arch }}
    needs: tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            target: x86_64-unknown-linux-gnu
            platform: linux/amd64
          - os: ubuntu-24.04-arm
            arch: arm64
            target: aarch64-unknown-linux-gnu
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Build in AlmaLinux 8 (glibc 2.28)
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          WORKSPACE="$(pwd)"
          mkdir -p dist
          docker run --rm \
            --platform "$PLATFORM" \
            -v "$WORKSPACE:/workspace" \
            -w /workspace \
            -e TARGET="$TARGET" \
            -e TAG="$RELEASE_TAG" \
            almalinux:8 bash -c '
              set -euo pipefail
              dnf install -y --setopt=install_weak_deps=False \
                gcc gcc-c++ make cmake pkgconf-pkg-config \
                gtk3-devel libxkbcommon-devel wayland-devel \
                ca-certificates curl-minimal perl tar gzip findutils
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
              sh /tmp/rustup.sh -y --profile minimal --default-toolchain stable
              . "$HOME/.cargo/env"
              cargo build --release --target "$TARGET"

              STAGE="dist/rmdv-$TAG-$TARGET"
              rm -rf "$STAGE"
              mkdir -p "$STAGE"
              cp "target/$TARGET/release/rmdv" "$STAGE/rmdv"

              # PDFium is loaded from next to the binary at runtime; pick it up
              # from the build tree or the download cache.
              SO=""
              for dir in "target/$TARGET/release" "target" "$HOME/.cache/pdfium-rs"; do
                [ -d "$dir" ] || continue
                SO=$(find "$dir" -name libpdfium.so -type f -print -quit)
                [ -n "$SO" ] && break
              done
              if [ -n "$SO" ]; then
                cp "$SO" "$STAGE/libpdfium.so"
              else
                echo "::warning::libpdfium.so not found; archive ships without PDF support"
              fi
              cp README.md LICENSE "$STAGE/"

              MAX_GLIBC=$(objdump -T "$STAGE/rmdv" | grep -o "GLIBC_[0-9.]*" | sort -Vu | tail -1)
              echo "highest GLIBC symbol requirement: ${MAX_GLIBC:-none}"
              if [ -n "$MAX_GLIBC" ] && [ "$(printf "%s\nGLIBC_2.28\n" "$MAX_GLIBC" | sort -V | tail -1)" != "GLIBC_2.28" ]; then
                echo "::error::binary requires $MAX_GLIBC, above the glibc 2.28 floor"
                exit 1
              fi

              tar -czf "dist/rmdv-$TAG-$TARGET.tar.gz" -C dist "rmdv-$TAG-$TARGET"
            '
          sudo chown -R "$(id -u):$(id -g)" "$WORKSPACE/target" "$WORKSPACE/dist"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # ── Publish: fail closed unless all six archives exist, then upload them
  #    with SHA256SUMS. Manual runs publish only with an explicit tag and
  #    `dry_run: false`.
  release:
    name: Publish release
    needs: [build-windows, build-macos, build-linux]
    if: "startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' && github.event.inputs.dry_run == 'false')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Verify artifacts and write checksums
        shell: bash
        run: |
          set -euo pipefail
          cd out
          ls -l
          expected=(
            "rmdv-${RELEASE_TAG}-x86_64-pc-windows-msvc.zip"
            "rmdv-${RELEASE_TAG}-aarch64-pc-windows-msvc.zip"
            "rmdv-${RELEASE_TAG}-x86_64-apple-darwin.tar.gz"
            "rmdv-${RELEASE_TAG}-aarch64-apple-darwin.tar.gz"
            "rmdv-${RELEASE_TAG}-x86_64-unknown-linux-gnu.tar.gz"
            "rmdv-${RELEASE_TAG}-aarch64-unknown-linux-gnu.tar.gz"
          )
          for f in "${expected[@]}"; do
            [ -s "$f" ] || { echo "::error::missing or empty artifact: $f"; exit 1; }
          done
          sha256sum * > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Pick release notes
        id: notes
        shell: bash
        run: |
          FILE="docs/releases/${RELEASE_TAG}-release-notes.md"
          if [ -f "$FILE" ]; then
            echo "path=$FILE" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}
          files: |
            out/*.zip
            out/*.tar.gz
            out/SHA256SUMS
          fail_on_unmatched_files: true
